[package]
name = "argon-parser"
publish = false
edition = "2024"
build = "build.rs"

[features]
default = []
std = ["argon-util/std", "parse18-runtime/std"]

[dependencies]
argon-util = { workspace = true, default-features = false }
embedded-io = { workspace = true }
encoding_rs = { workspace = true }
parse18-runtime = { workspace = true, default-features = false }
unicode-general-category = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
argon-testcases = { workspace = true }
rstest = { workspace = true }

[build-dependencies]
parse18-lexer-gen = { workspace = true }
parse18-ll-gen = { workspace = true }
strum = { workspace = true }

[lints]
workspace = true
