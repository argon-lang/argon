[package]
name = "argon-compiler"
publish = false
edition = "2024"

[features]
default = []
std = ["argon-expr/std", "argon-parser/std", "argon-util/std", "parse18-runtime/std"]
test-utils = []

[dependencies]
argon-expr = { path = "../argon-expr", default-features = false }
argon-parser = { path = "../argon-parser", default-features = false }
argon-util = { path = "../argon-util", default-features = false }
esexpr = { workspace = true }
hashbrown = { workspace = true }
mitsein = { workspace = true }
percent-encoding = { workspace = true }
parse18-runtime = { path = "../parse18/parse18-runtime", default-features = false }

[lints]
workspace = true
