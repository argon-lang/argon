[package]
name = "argon-test-runner"
publish = false
edition = "2024"
build = "build.rs"

[[test]]
name = "compiler_tests_js"
path = "tests/compiler_tests_js.rs"
harness = false

[[test]]
name = "compiler_tests_js_opt"
path = "tests/compiler_tests_js_opt.rs"
harness = false

[[test]]
name = "compiler_tests_jvm"
path = "tests/compiler_tests_jvm.rs"
harness = false

[[test]]
name = "compiler_tests_jvm_opt"
path = "tests/compiler_tests_jvm_opt.rs"
harness = false

[[test]]
name = "compiler_tests_perl"
path = "tests/compiler_tests_perl.rs"
harness = false

[[test]]
name = "compiler_tests_perl_opt"
path = "tests/compiler_tests_perl_opt.rs"
harness = false

[[bin]]
name = "compile-testcases"
path = "src/bin/compile_testcases.rs"

[[bin]]
name = "compiler-tests-dist-js"
path = "src/bin/compiler_tests_dist_js.rs"

[[bin]]
name = "compiler-tests-dist-jvm"
path = "src/bin/compiler_tests_dist_jvm.rs"

[[bin]]
name = "compiler-tests-dist-perl"
path = "src/bin/compiler_tests_dist_perl.rs"

[dependencies]
argon-io = { workspace = true, features = ["std"] }
argon-opt = { workspace = true, features = ["std"] }
argon-tasks = { workspace = true, features = ["std"] }
argon-testcases = { workspace = true }
argon-util = { workspace = true, features = ["std"] }
clap = { workspace = true }
dhat = { workspace = true, optional = true }
libtest-mimic = { workspace = true }
fs_extra = { workspace = true }
futures-lite = { workspace = true }
embedded-io = { workspace = true }
esexpr = { workspace = true, features = ["std"] }
esexpr-binary = { workspace = true, features = ["std"] }
hashbrown = { workspace = true }
serde = { workspace = true, features = ["derive"] }
subprocess = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml_edit = { workspace = true }
walkdir = { workspace = true }

[features]
dhat-heap = ["dep:dhat"]

[lints]
workspace = true
