[package]
name = "argon-test-runner"
publish = false
edition = "2024"
build = "build.rs"

[[test]]
name = "compiler_tests"
path = "tests/compiler_tests.rs"
harness = false

[[bin]]
name = "compile-testcases"
path = "src/bin/compile_testcases.rs"

[[bin]]
name = "compiler-tests-dist"
path = "src/bin/compiler_tests_dist.rs"

[dependencies]
argon-io = { workspace = true }
argon-runner = { workspace = true }
argon-testcases = { workspace = true }
argon-util = { workspace = true }
clap = { workspace = true }
dhat = { workspace = true, optional = true }
libtest-mimic = { workspace = true }
fs_extra = { workspace = true }
hashbrown = { workspace = true }
serde = { workspace = true, features = ["derive"] }
subprocess = { workspace = true }
tempfile = { workspace = true }
toml_edit = { workspace = true }
walkdir = { workspace = true }

[features]
dhat-heap = ["dep:dhat"]

[lints]
workspace = true
