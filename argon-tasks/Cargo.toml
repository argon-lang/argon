[package]
name = "argon-tasks"
version = "0.1.0"
edition = "2024"

[features]
default = []
std = ["argon-compiler/std", "argon-format/std", "argon-format-vm/std", "argon-io/std", "argon-opt/std", "argon-source/std", "argon-tube/std", "argon-util/std", "argon-vm/std", "embedded-io/std", "embedded-io-async/std", "esexpr/std", "esexpr-binary/std", "parse18-runtime/std", "dep:boa_engine", "dep:boa_runtime", "dep:jni"]
nodejs = []

[dependencies]
argon-compiler = { workspace = true }
argon-format = { workspace = true }
argon-format-vm = { workspace = true }
argon-io = { workspace = true }
argon-opt = { workspace = true }
argon-source = { workspace = true }
argon-tube = { workspace = true }
argon-util = { workspace = true }
argon-vm = { workspace = true }

embedded-io = { workspace = true }
embedded-io-async = { workspace = true }
esexpr = { workspace = true }
esexpr-binary = { workspace = true }
hashbrown = { workspace = true }
noble-idl-runtime = { workspace = true }
parse18-runtime = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
boa_engine = { workspace = true, optional = true }
boa_runtime = { workspace = true, optional = true }
jni = { workspace = true, optional = true }
tokio = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[build-dependencies]
noble-idl-compiler-rust = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.noble-idl.package_mapping]
"argon.backend.metadata" = "backend::metadata"
"argon.tasks" = "message"
