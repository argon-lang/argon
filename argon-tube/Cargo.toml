argon-util = { workspace = true, default-features = false }
embedded-io = { workspace = true }
esexpr = { workspace = true }
esexpr-binary = { workspace = true, default-features = false }
hashbrown = { workspace = true }
mitsein = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }

[lints]
workspace = true
