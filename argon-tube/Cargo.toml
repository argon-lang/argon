[package]
name = "argon-tube"
publish = false
edition = "2024"

[features]
default = []
std = [
    "argon-compiler/std",
    "argon-expr/std",
    "argon-util/std",
    "esexpr/std",
    "esexpr-binary/std",
]

[dependencies]
argon-compiler = { workspace = true, default-features = false }
argon-expr = { workspace = true, default-features = false }
