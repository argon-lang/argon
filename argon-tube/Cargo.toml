[package]
name = "argon-tube"
publish = false
edition = "2024"

[features]
default = ["std"]
std = [
    "argon-compiler/std",
    "argon-expr/std",
    "argon-util/std",
    "esexpr/std",
    "esexpr-binary/std",
]

[dependencies]
argon-compiler = { path = "../argon-compiler", default-features = false }
argon-expr = { path = "../argon-expr", default-features = false }
argon-format = { path = "../argon-format" }
argon-util = { path = "../argon-util", default-features = false }
esexpr = { workspace = true }
esexpr-binary = { workspace = true, default-features = false }
hashbrown = { workspace = true }
mitsein = { workspace = true }
num-bigint = { workspace = true }

[lints]
workspace = true
